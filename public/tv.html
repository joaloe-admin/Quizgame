<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game — TV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
#app { width: 100vw; height: 100vh; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 40%, #06b6d4 100%); display: flex; flex-direction: column; position: relative; }

.screen { position: absolute; inset: 0; display: none; flex-direction: column; z-index: 1; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 40%, #06b6d4 100%); }
.screen.active { display: flex; z-index: 2; }

/* ── LOBBY ── */
#sc-lobby { padding: 0.6rem 2rem; display: flex; flex-direction: column; height: 100vh; position: relative; }
.lobby-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; flex-shrink: 0; }
.lobby-center-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }
.lobby-title-main { font-size: 48px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #fff 0%, #bfdbfe 60%, #93c5fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; white-space: nowrap; }
.lobby-logo { display: flex; align-items: center; }
.lobby-join-info { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.15); border-radius: 16px; padding: 10px 14px; }
.lobby-join-code { font-size: 38px; font-weight: 900; color: #fff; letter-spacing: 8px; }
.lobby-qr { border-radius: 8px; background: #fff; padding: 4px; }
.chars-section { flex: 1; display: flex; flex-direction: column; overflow: visible; min-height: 0; max-height: 55vh; justify-content: center; }
.chars-section-label { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-align: center; margin-bottom: 0.4rem; flex-shrink: 0; }
.chars-bubbles { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 12px; padding: 0 1.5rem 0.5rem 1.5rem; align-content: center; overflow: visible; }
.char-bubble { width: 100%; max-width: 120px; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,0.12); border: 4px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; position: relative; transition: border-color .2s; margin: 0 auto; }
.char-bubble-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.char-bubble-name { font-size: clamp(13px, 1.4vw, 18px); font-weight: 700; color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
.char-bubble .taken-badge { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); background: #10b981; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 99px; white-space: nowrap; }
.players-bar { background: rgba(0,0,0,0.2); padding: 0.5rem 2rem; display: flex; align-items: flex-end; gap: 16px; min-height: 80px; flex-shrink: 0; }
.player-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.player-slot .avatar-wrap { width: 70px; height: 80px; display: flex; align-items: flex-end; justify-content: center; }
.player-slot .player-name-tag { font-size: 12px; font-weight: 700; color: #fff; border-radius: 99px; padding: 3px 12px; }
.start-area { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.player-count-badge { font-size: 13px; color: rgba(255,255,255,0.8); font-weight: 600; }
.start-btn { padding: 14px 32px; background: #10b981; color: #fff; border: none; border-radius: 99px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all .15s; }
.start-btn:hover { opacity: .88; }
.start-btn:disabled { background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); cursor: default; }

/* ── SPLASH ── */
#sc-splash { align-items: center; justify-content: center; }
.splash-emoji-big { font-size: 100px; display: block; margin-bottom: 1rem; animation: popIn .4s cubic-bezier(.34,1.56,.64,1); }
.splash-title { font-size: 48px; font-weight: 900; color: #fff; text-align: center; }
.splash-ready { font-size: 20px; color: rgba(255,255,255,0.8); margin-top: 8px; text-align: center; }
@keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ── QUESTION ── */
#sc-question { padding: 0.5rem 1.5rem; }
.q-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-shrink: 0; }
.q-subject-badge { background: rgba(255,255,255,0.2); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 16px; border-radius: 99px; }
.progress-dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 400px; }
.pdot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all .3s; }
.pdot.done { background: rgba(255,255,255,0.6); }
.pdot.current { background: #fff; width: 14px; height: 14px; }
.q-players-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 0.8rem; flex-shrink: 0; }
.q-player { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.q-player .avatar-circle { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.3); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; transition: border-color .3s; }
.q-player .avatar-circle.answered { border-color: #10b981; }
.q-player .crown { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 18px; display: none; }
.q-player.leader .crown { display: block; }
.q-player .q-score { font-size: 15px; font-weight: 800; color: #fff; }
.q-player .q-pname { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 600; }
.q-player .q-timer-badge { background: #06b6d4; color: #fff; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; min-width: 40px; text-align: center; }
.q-player .q-timer-badge.answered { background: #10b981; }

/* Audio player */
.audio-player { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 1rem 2rem; margin-bottom: 0.8rem; display: none; flex-shrink: 0; align-items: center; gap: 1.5rem; }
.audio-player.active { display: flex; }
.audio-note { font-size: 32px; animation: noteBounce 0.6s infinite alternate; flex-shrink: 0; }
@keyframes noteBounce { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.2) rotate(5deg); } }
.audio-bars { display: flex; gap: 4px; align-items: flex-end; height: 40px; flex-shrink: 0; }
.audio-bar { width: 6px; border-radius: 3px; background: #fff; animation: barAnim 0.5s infinite alternate; }
.audio-bar:nth-child(1){animation-delay:0s} .audio-bar:nth-child(2){animation-delay:.1s} .audio-bar:nth-child(3){animation-delay:.2s}
.audio-bar:nth-child(4){animation-delay:.3s} .audio-bar:nth-child(5){animation-delay:.4s} .audio-bar:nth-child(6){animation-delay:.15s} .audio-bar:nth-child(7){animation-delay:.25s}
@keyframes barAnim { from { height: 6px; opacity: .5; } to { height: 36px; opacity: 1; } }
.audio-label { flex: 1; }
.audio-label-top { font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 3px; }
.audio-label-main { font-size: 18px; font-weight: 700; color: #fff; }
.audio-timer-badge { font-size: 28px; font-weight: 800; color: #fff; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 6px 16px; flex-shrink: 0; }

/* Timer bar */
.timer-bar-wrap { width: 100%; padding: 0 1rem; flex-shrink: 0; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 14px; }
.timer-bar-track { flex: 1; height: 14px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; }
.timer-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444); transition: width 1s linear; width: 100%; }
.timer-bar-fill.urgent { background: linear-gradient(90deg, #ef4444, #dc2626); animation: pulse-bar 0.5s ease-in-out infinite alternate; }
@keyframes pulse-bar { from { opacity: 1; } to { opacity: 0.6; } }
.timer-bar-num { font-size: 28px; font-weight: 900; color: #fff; min-width: 44px; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.timer-bar-num.urgent { color: #fca5a5; }

/* Question box */
.q-box { background: rgba(255,255,255,0.12); border-radius: 20px; padding: 0.8rem 1.5rem; text-align: center; margin-bottom: 0.4rem; flex-shrink: 0; }
.q-text { font-size: clamp(16px, 2vw, 24px); font-weight: 700; color: #fff; line-height: 1.3; }
.q-image-wrap { display: none; position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
.q-image-wrap.visible { display: block; }
.q-image { width: 280px; height: 280px; object-fit: cover; border-radius: 50%; box-shadow: 0 16px 60px rgba(0,0,0,0.6); border: 6px solid rgba(255,255,255,0.6); }
.opts-grid { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 160px; overflow: visible; }
.opt { background: rgba(255,255,255,0.92); border-radius: 18px; padding: 10px 18px; font-size: clamp(14px, 1.5vw, 18px); font-weight: 700; color: #1e3a8a; display: flex; align-items: center; gap: 10px; transition: all .4s; position: absolute; max-width: 300px; width: 100%; }
.opt-top    { top: 0px; left: 50%; transform: translateX(-50%); justify-content: center; text-align: center; }
.opt-bottom { bottom: 0px; left: 50%; transform: translateX(-50%); justify-content: center; text-align: center; }
.opt-left   { left: 0px; top: 50%; transform: translateY(-50%); }
.opt-right  { right: 0px; top: 50%; transform: translateY(-50%); }
.opt .opt-arrow { font-size: 22px; flex-shrink: 0; }
.opt .opt-letter { width: 32px; height: 32px; border-radius: 50%; background: #1d4ed8; color: #fff; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.opt.correct { background: #10b981; color: #fff; }
.opt.correct .opt-letter { background: rgba(255,255,255,0.3); }
.opt.wrong { background: rgba(255,255,255,0.25); color: rgba(255,255,255,0.5); }

.answer-counter { text-align: center; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.85); margin-bottom: 4px; flex-shrink: 0; }
.correct-names { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 28px; flex-shrink: 0; }
.correct-name-chip { background: rgba(16,185,129,0.25); border: 1px solid #10b981; border-radius: 99px; padding: 3px 14px; font-size: 13px; font-weight: 700; color: #fff; animation: chipPop 0.3s cubic-bezier(.34,1.56,.64,1); }
@keyframes chipPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.explain-text { display: none; background: rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 18px; font-size: 14px; color: #fff; text-align: center; margin: 4px 1rem; flex-shrink: 0; font-style: italic; }
.scoreboard { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; margin-top: 6px; justify-content: center; }
.score-chip { background: rgba(255,255,255,0.08); border-radius: 99px; padding: 4px 12px; font-size: 12px; color: #ccc9e8; display: flex; align-items: center; gap: 5px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── ROUND END / PODIUM ── */
#sc-round-end { align-items: center; justify-content: center; padding: 2rem; }
.round-title { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 4px; }
.round-subtitle { font-size: 16px; color: rgba(255,255,255,0.75); margin-bottom: 2rem; }
.rank-list { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
.rank-row { background: rgba(255,255,255,0.15); border-radius: 16px; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.rank-row.first { background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.4); }
.rank-medal { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
.rank-name { flex: 1; font-size: 16px; font-weight: 700; color: #fff; }
.rank-score { font-size: 18px; font-weight: 800; color: #fff; }
.btn-new-game-round { padding: 14px 40px; background: #10b981; color: #fff; border: none; border-radius: 99px; font-size: 16px; font-weight: 800; cursor: pointer; }
.btn-new-game-round:hover { opacity: .88; }

#sc-podium { align-items: center; justify-content: center; padding: 2rem; }
.podium-heading { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 4px; }
.podium-sub { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 2.5rem; }
.podium-row { display: flex; align-items: flex-end; justify-content: center; gap: 20px; margin-bottom: 2rem; }
.pod-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pod-avatar { width: 90px; height: 90px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 3px solid rgba(255,255,255,0.4); overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.pod-bar { border-radius: 10px 10px 0 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; width: 100px; }
.pod-name { font-size: 14px; color: #fff; font-weight: 700; }
.pod-pts { font-size: 12px; color: rgba(255,255,255,0.7); }
.btn-new-game { padding: 14px 40px; background: #fff; color: #1d4ed8; border: none; border-radius: 99px; font-size: 16px; font-weight: 800; cursor: pointer; }
.btn-new-game:hover { opacity: .88; }
</style>
</head>
<body>
<div id="app">

  <!-- LOBBY -->
  <div class="screen active" id="sc-lobby">
    <div class="lobby-topbar">
      <div class="lobby-logo"><img src="/img/logo.png" alt="JSupport Quiz" style="height:56px;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));"></div>
      <div class="lobby-center-title">
        <span class="lobby-title-main">Quiz Game</span>
      </div>
      <div class="lobby-join-info">
        <div style="text-align:center">
          <div style="font-size:12px;color:rgba(255,255,255,0.7);font-weight:600;margin-bottom:2px;">Scansiona o inserisci</div>
          <div class="lobby-join-code" id="lobby-code">----</div>
        </div>
        <div class="lobby-qr"><img id="qr-img" width="72" height="72" alt="QR"></div>
      </div>
    </div>
    <div class="chars-section">
      <div class="chars-section-label">Scegli il tuo personaggio dal telefono</div>
      <div class="chars-bubbles" id="chars-bubbles"></div>
    </div>
    <div class="players-bar">
      <div id="players-bar-slots" style="display:flex;gap:16px;align-items:flex-end;flex:1"></div>
      <div class="start-area">
        <div class="player-count-badge" id="player-count-badge">0 giocatori connessi</div>
        <button class="start-btn" id="start-btn" disabled onclick="startGame()">▶ Avvia partita</button>
      </div>
    </div>
  </div>

  <!-- SPLASH "Pronti?" -->
  <div class="screen" id="sc-splash">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1">
      <span class="splash-emoji-big" id="splash-emoji">🎮</span>
      <div class="splash-title" id="splash-title">Cultura Generale</div>
      <div class="splash-ready">Preparatevi! 20 domande miste!</div>
    </div>
  </div>

  <!-- QUESTION -->
  <div class="screen" id="sc-question">
    <div class="q-topbar">
      <div class="q-subject-badge" id="q-subject-badge">🌍 Quiz</div>
      <div class="progress-dots" id="progress-dots"></div>
      <div style="width:60px"></div>
    </div>
    <div class="q-players-row" id="q-players-row"></div>
    <div class="audio-player" id="audio-player">
      <div class="audio-note">🎵</div>
      <div class="audio-bars">
        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
        <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
        <div class="audio-bar"></div>
      </div>
      <div class="audio-label">
        <div class="audio-label-top">Ascolta e indovina...</div>
        <div class="audio-label-main" id="audio-question-text"></div>
      </div>
      <div class="audio-timer-badge" id="audio-timer">15s</div>
    </div>
    <audio id="summer-audio" src="/audio/summer_house.mp3" loop preload="auto"></audio>
    <audio id="game-audio" src="/audio/lobby_music.mp3" loop preload="auto"></audio>
    <div id="yt-container" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
    <div class="timer-bar-wrap">
      <div class="timer-bar-num" id="timer-bar-num">15</div>
      <div class="timer-bar-track"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>
    </div>
    <div class="q-box" id="q-box"><div class="q-text" id="q-text"></div></div>
    <div class="opts-grid" id="opts-grid">
      <div class="q-image-wrap" id="q-image-wrap">
        <img class="q-image" id="q-image" src="" alt="">
      </div>
    </div>
    <div class="answer-counter" id="answer-counter"></div>
    <div class="correct-names" id="correct-names"></div>
    <div class="explain-text" id="explain-text"></div>
    <div class="scoreboard" id="scoreboard"></div>
  </div>

  <!-- ROUND END (usato anche come risultato finale intermedio) -->
  <div class="screen" id="sc-round-end">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:2rem">
      <div class="round-title" id="round-end-title">Fine partita! 🎉</div>
      <div class="round-subtitle" id="round-end-sub">Classifica finale</div>
      <div class="rank-list" id="rank-list"></div>
      <button class="btn-new-game-round" onclick="endGame()">🏆 Vedi podio</button>
    </div>
  </div>

  <!-- PODIUM -->
  <div class="screen" id="sc-podium">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:2rem">
      <div class="podium-heading">🏆 Classifica finale!</div>
      <div class="podium-sub">Complimenti a tutti i partecipanti</div>
      <div class="podium-row" id="podium-row"></div>
      <button class="btn-new-game" onclick="resetGame()">🔄 Nuova partita</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const PLAYER_COLORS = ['#a78bfa','#22d3ee','#f59e0b','#f472b6','#4ade80','#ef4444','#92400e','#10b981','#3b82f6','#f97316','#6366f1','#84cc16','#eab308','#06b6d4'];

function charSVG(id, w, h) {
  const ws = typeof w === 'string' && w.includes('%') ? w : w + 'px'; const hs = typeof h === 'string' && h.includes('%') ? h : h + 'px'; return `<img src="/chars/${id}.png" style="width:${ws};height:${hs};object-fit:contain;object-position:center center;" alt="${id}">`;
}

let currentPlayers = [];
let timeLeft = 15;

// ── AUDIO ──
function startLobbyMusic() {
  const s = document.getElementById('summer-audio');
  if (!s) return;
  s.volume = 0.4; s.currentTime = 0;
  s.play().catch(() => document.addEventListener('click', () => s.play().catch(()=>{}), { once: true }));
}
function stopLobbyMusic() {
  const s = document.getElementById('summer-audio');
  if (s) { s.pause(); s.currentTime = 0; }
}
function startGameMusic() {
  stopLobbyMusic();
  const g = document.getElementById('game-audio');
  if (!g) return;
  g.volume = 0.35; g.currentTime = 0;
  g.play().catch(()=>{});
}
function stopGameMusic() {
  const g = document.getElementById('game-audio');
  if (g) { g.pause(); g.currentTime = 0; }
}
function stopAllMusic() { stopLobbyMusic(); stopGameMusic(); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const ALL_CHAR_IDS = ['sofia','nova','quinn','flora','rebel','sage','pixel','jay','leo','rico','finn','beat','mimo','nerd'];
const CHAR_NAMES   = {sofia:'Sofia',nova:'Nova',quinn:'Quinn',flora:'Flora',rebel:'Rebel',sage:'Sage',pixel:'Pixel',jay:'Jay',leo:'Leo',rico:'Rico',finn:'Finn',beat:'Beat',mimo:'Mimo',nerd:'Nerd'};

function buildCharBubbles() {
  document.getElementById('chars-bubbles').innerHTML = ALL_CHAR_IDS.map(id => {
    const taken = currentPlayers.find(p => p.char.id === id);
    const col = taken ? PLAYER_COLORS[currentPlayers.indexOf(taken) % PLAYER_COLORS.length] : '';
    return `<div class="char-bubble-wrap">
      <div class="char-bubble" style="${taken ? 'border-color:'+col+';border-width:4px' : ''}">
        ${charSVG(id, '100%', '100%')}
        ${taken ? `<div class="taken-badge">${taken.name}</div>` : ''}
      </div>
      <div class="char-bubble-name" style="${taken ? 'color:#fff;font-weight:700' : ''}">${CHAR_NAMES[id]}</div>
    </div>`;
  }).join('');
}

function buildPlayersBar(players) {
  currentPlayers = players;
  buildCharBubbles();
  document.getElementById('players-bar-slots').innerHTML = players.map((p, i) =>
    `<div class="player-slot">
      <div class="avatar-wrap">${charSVG(p.char.id, 80, 90)}</div>
      <div class="player-name-tag" style="background:${PLAYER_COLORS[i % PLAYER_COLORS.length]}">${p.name}</div>
    </div>`).join('');
  const n = players.length;
  document.getElementById('player-count-badge').textContent = n === 1 ? '1 giocatore connesso' : `${n} giocatori connessi`;
  const btn = document.getElementById('start-btn');
  btn.disabled = n < 1;
  btn.textContent = n < 1 ? '▶ Avvia partita' : `▶ Avvia — ${n} pronti!`;
}

function buildQPlayersRow(players, answeredNames) {
  const leader = [...players].sort((a,b) => b.score - a.score)[0];
  document.getElementById('q-players-row').innerHTML = players.map((p, i) => {
    const isLeader = leader && p.name === leader.name && leader.score > 0;
    const isAns = answeredNames && answeredNames.includes(p.name);
    return `<div class="q-player ${isLeader ? 'leader' : ''}">
      <div class="crown">👑</div>
      <div class="avatar-circle ${isAns ? 'answered' : ''}">${charSVG(p.char.id, 52, 52)}</div>
      <div class="q-score">${p.score}</div>
      <div class="q-pname">${p.name}</div>
      <div class="q-timer-badge ${isAns ? 'answered' : ''}" id="qtb-${i}">${isAns ? '✓' : timeLeft+'s'}</div>
    </div>`;
  }).join('');
}

function buildProgressDots(current, total) {
  document.getElementById('progress-dots').innerHTML = Array.from({length: total}, (_, i) =>
    `<div class="pdot ${i < current ? 'done' : i === current ? 'current' : ''}"></div>`
  ).join('');
}

function updateScoreboard(players) {
  document.getElementById('scoreboard').innerHTML = players.map(p =>
    `<div class="score-chip"><div class="sdot" style="background:${p.char.color}"></div>${p.name}: <b>${p.score}</b>${p.answered?' ✓':''}</div>`
  ).join('');
}

async function loadQR(code) {
  try {
    const data = await fetch('/qr?code=' + (code||'')).then(r => r.json());
    document.getElementById('qr-img').src = data.qr;
    if (code) document.getElementById('lobby-code').textContent = code;
  } catch(e) {}
}

// ── SOCKET EVENTS ──
socket.on('room-info', ({ code, players }) => {
  startLobbyMusic();
  document.getElementById('lobby-code').textContent = code;
  buildPlayersBar(players);
  loadQR(code);
});

socket.on('players-update', ({ players }) => buildPlayersBar(players));

socket.on('player-answered', ({ name, correct, players }) => {
  const answered = players.filter(p => p.answered);
  buildQPlayersRow(players, answered.map(p => p.name));
  const counter = document.getElementById('answer-counter');
  if (counter) counter.textContent = `${answered.length} / ${players.length} hanno risposto`;
  if (correct && name) {
    const container = document.getElementById('correct-names');
    if (container) {
      const chip = document.createElement('div');
      chip.className = 'correct-name-chip';
      chip.textContent = '✓ ' + name;
      container.appendChild(chip);
    }
  }
  updateScoreboard(players);
});

// Splash prima delle domande
socket.on('game-starting', ({ emoji, title }) => {
  stopAllMusic();
  document.getElementById('splash-emoji').textContent = emoji || '🎮';
  document.getElementById('splash-title').textContent = title || 'Cultura Generale';
  showScreen('sc-splash');
});

socket.on('question', ({ index, total, subject, emoji, q, yt, opts, imageUrl, type, explain, players }) => {
  startGameMusic();
  if (players && players.length) currentPlayers = players;
  timeLeft = 15;
  const fill = document.getElementById('timer-bar-fill');
  const num  = document.getElementById('timer-bar-num');
  if (fill) { fill.style.width = '100%'; fill.classList.remove('urgent'); }
  if (num)  { num.textContent = '15'; num.classList.remove('urgent'); }
  showScreen('sc-question');
  document.getElementById('q-subject-badge').textContent = emoji + ' ' + subject;
  buildProgressDots(index, total);
  buildQPlayersRow(currentPlayers, []);
  document.getElementById('scoreboard').innerHTML = '';
  const ac = document.getElementById('answer-counter'); if (ac) ac.textContent = '';
  const cn = document.getElementById('correct-names'); if (cn) cn.innerHTML = '';
  const ex = document.getElementById('explain-text');  if (ex) { ex.textContent = ''; ex.style.display = 'none'; }

  const arrows    = ['↑','↓','←','→'];
  const positions = ['opt-top','opt-bottom','opt-left','opt-right'];
  const letters   = ['A','B','C','D'];
  const grid = document.getElementById('opts-grid');
  grid.querySelectorAll('.opt').forEach(el => el.remove());
  opts.forEach((o, i) => {
    const div = document.createElement('div');
    div.className = `opt ${positions[i]}`;
    div.id = `opt-${i}`;
    div.innerHTML = `<span class="opt-arrow">${arrows[i]}</span><span class="opt-letter">${letters[i]}</span>${o}`;
    grid.appendChild(div);
  });

  const audioEl = document.getElementById('audio-player');
  const qBox    = document.getElementById('q-box');
  const ytEl    = document.getElementById('yt-container');
  if (yt) {
    audioEl.classList.add('active'); qBox.style.display = 'none';
    document.getElementById('audio-question-text').textContent = q;
    document.getElementById('audio-timer').textContent = '15s';
    ytEl.innerHTML = `<iframe width="1" height="1" src="https://www.youtube.com/embed/${yt}?autoplay=1&start=30&mute=0&controls=0" allow="autoplay" frameborder="0"></iframe>`;
  } else {
    audioEl.classList.remove('active'); qBox.style.display = 'block';
    document.getElementById('q-text').textContent = q;
    ytEl.innerHTML = '';
  }

  const imgWrap = document.getElementById('q-image-wrap');
  const imgEl   = document.getElementById('q-image');
  if (imgWrap && imgEl) {
    if (imageUrl) {
      imgEl.src = imageUrl; imgWrap.classList.add('visible'); qBox.style.display = 'none';
    } else {
      imgWrap.classList.remove('visible'); imgEl.src = '';
    }
  }
});

socket.on('timer', ({ timeLeft: tl }) => {
  timeLeft = tl;
  const fill = document.getElementById('timer-bar-fill');
  const num  = document.getElementById('timer-bar-num');
  const pct  = (tl / 15) * 100;
  if (fill) { fill.style.width = pct + '%'; fill.classList.toggle('urgent', tl <= 5); }
  if (num)  { num.textContent = tl; num.classList.toggle('urgent', tl <= 5); }
  const at = document.getElementById('audio-timer'); if (at) at.textContent = tl+'s';
  currentPlayers.forEach((_, i) => {
    const tb = document.getElementById('qtb-'+i);
    if (tb && !tb.classList.contains('answered')) tb.textContent = tl+'s';
  });
});

socket.on('reveal', ({ correctIndex, correctAnswer, explain, players }) => {
  const explainEl = document.getElementById('explain-text');
  if (explainEl) { explainEl.textContent = explain || ''; explainEl.style.display = explain ? 'block' : 'none'; }
  stopGameMusic();
  document.getElementById('yt-container').innerHTML = '';
  document.getElementById('audio-player').classList.remove('active');
  document.getElementById('q-box').style.display = 'block';
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('opt-'+i);
    if (el) el.classList.add(i === correctIndex ? 'correct' : 'wrong');
  }
  if (players) updateScoreboard(players);
});

socket.on('round-end', ({ players, isLastRound }) => {
  stopAllMusic();
  if (isLastRound) {
    // Mostra classifica finale prima del podio
    showScreen('sc-round-end');
    document.getElementById('round-end-title').textContent = '🏆 Partita terminata!';
    document.getElementById('round-end-sub').textContent = 'Ecco la classifica finale';
    const medals = ['🥇','🥈','🥉'];
    document.getElementById('rank-list').innerHTML = players.map((p, i) =>
      `<div class="rank-row ${i===0?'first':''}">
        <span class="rank-medal">${medals[i]||(i+1)+'°'}</span>
        ${charSVG(p.char.id, 44, 44)}
        <span class="rank-name">${p.name}</span>
        <span class="rank-score">${p.score} pt</span>
      </div>`
    ).join('');
  }
});

socket.on('podium', ({ players }) => {
  showScreen('sc-podium');
  const medals = ['🥇','🥈','🥉'];
  const order  = players.length >= 3 ? [players[1], players[0], players[2]] : players;
  const heights = [130, 180, 95];
  document.getElementById('podium-row').innerHTML = order.map((p, i) => {
    const rank = players.indexOf(p);
    return `<div class="pod-col">
      ${rank===0 ? '<div style="font-size:28px;margin-bottom:4px">👑</div>' : ''}
      <div class="pod-avatar">${charSVG(p.char.id, 72, 72)}</div>
      <div class="pod-bar" style="height:${heights[i]}px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4)">
        <span style="font-size:20px">${medals[rank]||''}</span>
      </div>
      <div class="pod-name">${p.name}</div>
      <div class="pod-pts">${p.score} pt</div>
    </div>`;
  }).join('');
});

socket.on('reset', ({ code }) => {
  document.getElementById('lobby-code').textContent = code;
  currentPlayers = [];
  buildPlayersBar([]);
  showScreen('sc-lobby');
  startLobbyMusic();
  loadQR(code);
});

// Avvia la partita direttamente, senza selezione categoria/difficoltà
function startGame()  { socket.emit('start-game', { rounds: 1, difficulty: 'medium' }); }
function endGame()    { socket.emit('end-game'); }
function resetGame()  { socket.emit('reset-game'); }

socket.on('connect', () => socket.emit('register-tv'));
loadQR();
buildCharBubbles();
</script>
</body>
</html>
